name: Build Mod JAR

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: |
          set +e
          ./gradlew build --no-daemon --stacktrace > gradle_build.log 2>&1
          EXIT_CODE=$?
          cat gradle_build.log
          if [ $EXIT_CODE -ne 0 ]; then
            MSG=$(grep -E "(error:|FAILURE:|What went wrong|> )" gradle_build.log | tail -n 35 | tr '\n' ' ' | sed 's/:/ /g')
            echo "::error title=GradleBuildError::$MSG"
            exit $EXIT_CODE
          fi

      - name: Upload compiled Mod JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: rodent_colonies-0.1.0
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
            !build/libs/*-dev.jar
          if-no-files-found: error

      - name: Publish GitHub Release with JAR
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          JAR_FILE=$(ls build/libs/rodent_colonies-*.jar | grep -vE '(-sources|-dev)\.jar' | head -n 1)
          echo "Built JAR: $JAR_FILE"
          if gh release view v0.1.0 >/dev/null 2>&1; then
            gh release upload v0.1.0 "$JAR_FILE" --clobber
          else
            gh release create v0.1.0 "$JAR_FILE" \
              --target "${{ github.sha }}" \
              --title "Rodent Colonies v0.1.0 (Fabric 1.20.1)" \
              --notes "Готовый скомпилированный файл мода **rodent_colonies-0.1.0.jar** для Minecraft 1.20.1 (Fabric). Скачайте файл ниже и положите его в папку \`mods\` вместе с Fabric API."
          fi
